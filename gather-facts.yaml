---
- name: Print facts
  hosts: local
  connection: local
  tasks:
    - name: Gather facts
      debug:
        msg: "{{ ansible_facts }}"
    - name: Print some information about the system
      debug:
        msg: |
          os family: {{ ansible_facts['os_family'] }}
          ip address: {{ ansible_facts['default_ipv4']['address'] }}  
          date_time: {{ ansible_facts['date_time'] }}
